schema_version: dynamic_workflow/run/v1
# Full authoring reference: skills/dynamic-workflow/references/plan.md
workflow_id: dwf_example
kind: mixed
backend: current
budget:
  max_steps: 20
  max_subagents: 8
  max_rounds: 3
steps:
  - step_id: collect_docs
    type: command.collect
    permission_profile: command_collector
    collect:
      commands:
        - id: readme_intro
          run: sed -n '1,120p' README.md
          timeout_seconds: 10
    produces:
      checks:
        select: $.output.collection.checks
        schema: command_collection/v1
    depends_on: []

  - step_id: review_docs
    type: agent.review
    permission_profile: reviewer_readonly
    input:
      prompt: Review collected documentation for inconsistencies and missing evidence.
    consumes:
      - from: collect_docs
        select: $.output.collection.checks[*].stdout
        as: docs
        required: true
        max_bytes: 20000
    depends_on:
      - collect_docs

  - step_id: summarize
    type: agent.synthesize
    permission_profile: synthesizer
    input:
      prompt: Summarize the review result with evidence.
    consumes:
      - from: review_docs
        select: $.output.status
        as: review_status
    depends_on:
      - review_docs

  - step_id: verify_runtime
    type: command.verify
    permission_profile: command_verifier
    verify:
      commands:
        - id: node_version
          run: node --version
          timeout_seconds: 10
    depends_on:
      - summarize
