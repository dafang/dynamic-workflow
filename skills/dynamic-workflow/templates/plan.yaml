schema_version: dynamic_workflow/run/v1
# Full authoring reference: skills/dynamic-workflow/references/plan.md
workflow_id: dwf_example
kind: mixed
backend: current
budget:
  max_steps: 20
  max_subagents: 8
  max_rounds: 3
steps:
  - step_id: collect_docs
    type: command.verify
    permission_profile: command_verifier
    input:
      commands:
        - sed -n '1,120p' README.md
    verify:
      commands:
        - sed -n '1,120p' README.md
    produces:
      checks:
        select: $.verify.checks
        schema: command_checks/v1
    depends_on: []

  - step_id: review_docs
    type: agent.review
    permission_profile: reviewer_readonly
    input:
      prompt: Review collected documentation for inconsistencies and missing evidence.
    consumes:
      - from: collect_docs
        select: $.verify.checks[*].stdout
        as: docs
        required: true
        max_bytes: 20000
    depends_on:
      - collect_docs

  - step_id: summarize
    type: agent.synthesize
    permission_profile: synthesizer
    input:
      prompt: Summarize the review result with evidence.
    consumes:
      - from: review_docs
        select: $.output.status
        as: review_status
    depends_on:
      - review_docs
